
name: Linux Dependency Test

on:
  workflow_dispatch:

jobs:
  test-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Install cloud requirements
        run: |
          python -m pip install -r requirements-cloud.txt

      - name: Check installed dependencies
        run: |
          python -m pip check

      - name: Test application imports
        run: |
          python -c "import streamlit, numpy, pandas, sklearn, dlib, face_recognition_models, supabase, bcrypt, segno, PIL, librosa, resemblyzer, torch, webrtcvad; print('All application dependencies imported successfully')"
